<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cyber Blaster WebXR - Meta Quest 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #05050d;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
    }
    /* Stylized Desktop / 2D Overlay */
    #desktop-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      z-index: 10;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.2);
      max-width: 350px;
    }
    #desktop-overlay h1 {
      font-size: 1.25rem;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #desktop-overlay p {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 242, 254, 0.15);
      color: #4facfe;
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      line-height: 1.5;
    }
    .controls-hint strong {
      color: #00f2fe;
    }
    .key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #fff;
    }
    /* Pointer lock instruction banner */
    #lock-banner {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.8);
      border: 1px solid #00f2fe;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 0.85rem;
      color: #00f2fe;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }
    /* VR button override */
    #VRButton {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%) !important;
      color: #050510 !important;
      font-weight: bold !important;
      letter-spacing: 1px !important;
      border: none !important;
      border-radius: 30px !important;
      padding: 14px 28px !important;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.5) !important;
      transition: transform 0.2s, box-shadow 0.2s !important;
      text-transform: uppercase !important;
    }
    #VRButton:hover {
      transform: scale(1.05) !important;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.8) !important;
    }
    /* Crosshair for desktop preview */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0, 242, 254, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      transition: transform 0.08s ease-out, border-color 0.08s ease-out;
    }
    #crosshair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      background: #00f2fe;
      border-radius: 50%;
    }
    #crosshair.fire {
      transform: translate(-50%, -50%) scale(1.5);
      border-color: #ff0055;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="desktop-overlay">
    <h1><span>🎯</span> Cyber Blaster</h1>
    <p><span class="badge">Desktop & Quest 3 Ready</span></p>
    <div class="controls-hint">
      <strong>Desktop / Mouse:</strong><br/>
      • Click screen to lock mouse & look around.<br/>
      • <span class="key">Left Click</span>: Fire Blaster.<br/>
      • <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span>: Move around platform.<br/>
      • <span class="key">Esc</span>: Unlock mouse cursor.<br/><br/>
      <strong>On Quest 3:</strong> Tap <em>Enter VR</em> to dual-wield!
    </div>
  </div>

  <div id="lock-banner">🖱️ Click anywhere to lock mouse & aim</div>

  <div id="crosshair"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
